[package]
name = "poki-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
base64 = "0.22"
idevice = { path = "../../.deps/idevice/idevice", default-features = false, features = ["aws-lc", "usbmuxd", "core_device", "display_stream", "core_device_proxy", "rsd", "tunnel_tcp_stack", "dvt", "afc", "installation_proxy", "springboardservices"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.7"
futures-util = "0.3"
uuid = { version = "1.16", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["test-util"] }
